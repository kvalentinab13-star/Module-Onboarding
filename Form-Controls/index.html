<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>My form exercise</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <h1>T-shirt Information</h1>
    </header>
    <main>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="e-mail">E-mail</label>
        <input type="email" id="e-mail" name="e-mail" required>

        <fieldset>
          <legend>Favourite Colour</legend>
      
        <label for="blue">Blue</label>
        <input type="radio" id="blue" name="favourite-colour" value="blue" required>

        <label for="red">Red</label> 
        <input type="radio" id="red" name="favourite-colour" value="red">

        <label for="black">Black</label>
        <input type="radio" id="black" name="favourite-colour" value="black">
        </fieldset>

        <label for="size">Clothing Size</label>

        <select id="size" name="size" required>
          <option value="">Select a size</option>
          <option value="XS">XS</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>

        <button type="submit">Submit</button>

      </form>
    </main>

    <footer>
      <h2>By Karen Valentina Gonzalez</h2>
    </footer>
  </body>
</html>
